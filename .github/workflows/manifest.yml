name: Update manifest
on:
  workflow_dispatch:
  release:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      run: python3 tools/generate_config.py Fantobus/mods files config.zip configs.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mods.json
          if [ -f configs.json ]; then git add configs.json; fi
          git diff --cached --quiet || git commit -m "Auto-update manifests"
          git push
